name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'sixteen'

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [a04]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp
          
          sudo apt install -yq linux-modules-extra-$(uname -r) || sudo apt install -yq linux-modules-extra-generic || true
          
          sudo modprobe erofs || true
          sudo modprobe f2fs || true
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          mkdir -p security out/odin/SM-A045F_INS
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8 || true
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem || true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Setup Firmware Manually from Drive
        run: |
          echo "Downloading firmware package..."
          wget -O /tmp/firmware.zip "https://drive.usercontent.google.com/download?id=1Y0-AG8XMwub_alGGUa5A3AaYASRStstj&export=download&authuser=0&confirm=t&uuid=55327e28-304f-44bf-a98f-3d46fd6ac74a&at=AMrWOn3QUh1KEH3SbNgrMVCdn1Nm%3A1793804976528"
          
          echo "Extracting firmware to UN1CA odin folder..."
          7z x /tmp/firmware.zip -out/odin/SM-A045F_INS/ -y || unzip /tmp/firmware.zip -d out/odin/SM-A045F_INS/
          
          # إنشاء علامة النجاح التي يقرأها سكربت UN1CA
          touch out/odin/SM-A045F_INS/.downloaded
          ls -la out/odin/SM-A045F_INS/

      - name: Extract stock firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh --no-rom-zip
