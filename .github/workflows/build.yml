name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'sixteen'

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [a04]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp python3-requests
          
          sudo apt install -yq linux-modules-extra-$(uname -r) || sudo apt install -yq linux-modules-extra-generic || true
          
          sudo modprobe erofs || true
          sudo modprobe f2fs || true
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          mkdir -p security out/odin/SM-A045F_INS
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8 || true
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem || true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Setup Firmware from Gofile API & Bypass Online Check
        run: |
          echo "Fetching direct download link from Gofile API..."
          python3 -c '
          import requests
          import urllib.request
          import sys

          # معرف المجلد من رابط Gofile الخاص بك (XyFTgMi)
          content_id = "XyFTgMi"
          api_url = f"https://api.gofile.io/contents/{content_id}"
          
          print(f"Querying Gofile API for content: {content_id}")
          resp = requests.get(api_url).json()
          
          if resp.get("status") != "ok":
              print("Error fetching from Gofile API:", resp)
              sys.exit(1)
              
          children = resp["data"]["children"]
          download_url = None
          for child_id, child_data in children.items():
              if "link" in child_data:
                  download_url = child_data["link"]
                  print(f"Found file: {child_data.get(\"name\")} ({child_data.get(\"size\")} bytes)")
                  break
                  
          if not download_url:
              print("Direct download link not found in Gofile response!")
              sys.exit(1)
              
          print("Downloading file directly...")
          urllib.request.urlretrieve(download_url, "/tmp/firmware.zip")
          print("Download completed successfully!")
          '

          echo "Verifying downloaded file size..."
          ls -lh /tmp/firmware.zip
          
          echo "Extracting firmware to odin folder..."
          7z x /tmp/firmware.zip -oout/odin/SM-A045F_INS/ -y || unzip /tmp/firmware.zip -d out/odin/SM-A045F_INS/
          
          # إنشاء علامة الاكتمال وإصدار الفريموير محلياً
          echo "A045FXXSGEZH2/A045FOXMGEZH2/A045FXXSGEZH2/A045FXXSGEZH2" > out/odin/SM-A045F_INS/.downloaded

          # تجاوز دالة GET_LATEST_FIRMWARE بالكامل برمجياً لتجنب أي اتصال بالخادم
          python3 -c '
          path = "scripts/utils/firmware_utils.sh"
          with open(path, "r") as f:
              content = f.read()

          override = """
          GET_LATEST_FIRMWARE() {
              cat "out/odin/${1}_${2}/.downloaded" 2>/dev/null || echo "A045FXXSGEZH2/A045FOXMGEZH2/A045FXXSGEZH2/A045FXXSGEZH2"
          }
          """
          content = override + "\n" + content
          with open(path, "w") as f:
              f.write(content)
          print("Successfully overridden GET_LATEST_FIRMWARE")
          '

      - name: Extract stock firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh --no-rom-zip
