name: Upload to Transfer.sh

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download file from source
        run: |
          echo "جاري تحميل الملف..."
          curl -L "https://sf06." -o large_file.bin
          ls -lh large_file.bin

      - name: Upload to Transfer.sh
        run: |
          echo "جاري رفع الملف إلى Transfer.sh..."
          # رفع الملف والحصول على الرابط المباشر مباشرة بدون تعقيد
          DIRECT_LINK=$(curl --upload-file large_file.bin https://transfer.sh/my_file.bin)
          
          echo "=========================================="
          echo "تم الرفع بنجاح! الرابط المباشر والدائم هو:"
          echo "$DIRECT_LINK"
          echo "=========================================="
