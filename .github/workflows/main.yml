name: Auto Upload to Direct Link Host

on:
  workflow_dispatch: # يتيح لك تشغيل العملية يدوياً وقتما تشاء بضغطة زر

jobs:
  upload-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 1. Download file from source link
        run: |
          echo "جاري تحميل الملف..."
          curl -L "https://sf06." -o my_file.bin

      - name: 2. Upload file to Catbox.moe (Direct Link)
        id: upload_step
        run: |
          echo "جاري رفع الملف للحصول على رابط مباشر وثابت..."
          RESPONSE=$(curl -s -F "reqtype=fileupload" -F "fileToUpload=@my_file.bin" https://catbox.moe/user/api.php)
          echo "direct_link=$RESPONSE" >> $GITHUB_OUTPUT
          echo "=========================================="
          echo "تم الرفع بنجاح! الرابط المباشر هو:"
          echo "$RESPONSE"
          echo "=========================================="
