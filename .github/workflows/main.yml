name: Upload Large File to PixelDrain

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download file from source
        run: |
          echo "جاري تحميل الملف الضخم..."
          curl -L "https://sf06." -o large_file.bin
          ls -lh large_file.bin

      - name: Upload to PixelDrain API
        run: |
          echo "جاري رفع الملف إلى PixelDrain..."
          RESPONSE=$(curl -s -T large_file.bin https://pixeldrain.com/api/file/)
          echo "Response: $RESPONSE"
          
          # استخراج معرف الملف عبر jq
          FILE_ID=$(echo "$RESPONSE" | jq -r '.id')
          
          echo "=========================================="
          echo "تم الرفع بنجاح!"
          echo "رابط التحميل المباشر والدائم هو:"
          echo "https://pixeldrain.com/api/file/$FILE_ID?download"
          echo "=========================================="
