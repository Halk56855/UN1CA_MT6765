name: Upload to Gofile

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download file from source
        run: |
          echo "جاري تحميل الملف..."
          curl -L "https://sf06." -o large_file.bin
          ls -lh large_file.bin

      - name: Upload to Gofile.io
        run: |
          echo "جاري جلب خادم Gofile النشط..."
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          echo "الخادم المختار: $SERVER"

          echo "جاري رفع الملف إلى Gofile..."
          RESPONSE=$(curl -s -F "file=@large_file.bin" https://$SERVER.gofile.io/contents/uploadfile)
          echo "Response: $RESPONSE"

          # استخراج رابط التحميل
          DOWNLOAD_LINK=$(echo "$RESPONSE" | jq -r '.data.downloadPage')

          echo "=========================================="
          echo "تم الرفع بنجاح! رابط التحميل المباشر والدائم هو:"
          echo "$DOWNLOAD_LINK"
          echo "=========================================="
